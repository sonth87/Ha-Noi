        "isAccessibleForFree": true

    <style>
      html, body, #root { margin: 0; height: 100%; height: 100dvh; background: #f3efe6; color: #544e44; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow: hidden; }
      html[data-theme="dark"] { background: #11100e; color: #9c9488; }
      html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #11100e; color: #9c9488; }
      .boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: inherit; }
      .boot-card { width: 100%; max-width: 440px; padding: 20px 22px; border-radius: 12px; border: 1px solid #d97706; background: rgba(249, 246, 239, 0.96); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12); display: flex; flex-direction: column; gap: 11px; }
      html[data-theme="dark"] .boot-card { background: rgba(24, 22, 19, 0.96); border-color: #f59e0b; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65); }
      .boot-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #d97706; text-transform: uppercase; }
      html[data-theme="dark"] .boot-badge { color: #fbbf24; }
      .boot-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .boot-title { margin: 0; font-size: 15px; font-weight: 700; color: #1c1915; }
      html[data-theme="dark"] .boot-title { color: #f3efe6; }
      .boot-sub { margin: 0; font-size: 11px; opacity: 0.85; }
      .boot-bar { width: 100%; height: 7px; border-radius: 999px; background: rgba(128, 120, 108, 0.18); overflow: hidden; position: relative; }
      .boot-bar-fill { width: 22%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #d97706, #fbbf24); animation: boot-indeterminate 1.4s ease-in-out infinite alternate; }
      @keyframes boot-indeterminate { 0% { width: 14%; transform: translateX(0%); } 100% { width: 42%; transform: translateX(130%); } }
    </style>
    <script>
      try {
        var t = localStorage.getItem('city3d-theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && location.search.indexOf('night=1') !== -1)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-badge"><span class="boot-dot"></span><span>HÀ NỘI · 3D ARCHITECTURAL MAP</span></div>
          <h1 class="boot-title">Khởi tạo Không gian Đô thị 3D</h1>
          <p class="boot-sub">Đang kết nối và nạp tài nguyên khởi động...</p>
          <div class="boot-bar"><div class="boot-bar-fill"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
