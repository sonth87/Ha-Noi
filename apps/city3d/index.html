    <style>
      html, body, #root { margin: 0; height: 100%; height: 100dvh; background: #f3efe6; color: #544e44; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow: hidden; }
      html[data-theme="dark"] { background: #11100e; color: #9c9488; }
      html[data-theme="dark"] body, html[data-theme="dark"] #root { background: #11100e; color: #9c9488; }
      .boot-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: inherit; }
      .boot-line-track { width: 100vw; height: 2px; background: rgba(128, 120, 108, 0.2); position: relative; overflow: hidden; }
      .boot-line-fill { width: 0%; height: 100%; background: #d97706; }
      html[data-theme="dark"] .boot-line-fill { background: #fbbf24; }
    </style>
    <script>
      try {
        var t = localStorage.getItem('city3d-theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && location.search.indexOf('night=1') !== -1)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-line-track"><div class="boot-line-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
