  <polygon points="24,35 32,31 32,48 24,52" fill="#1E1C18" stroke="#EDE8DF" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="12,30 20,26 32,31 24,35" fill="#38342D" stroke="#EDE8DF" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right taller isometric tower -->
  <polygon points="28,16 42,22 42,50 28,44" fill="#2F2B25" stroke="#EDE8DF" stroke-width="1.6" stroke-linejoin="round"/>
